ru:
  locale: ru_RU
  nav_solutions: Решения
  nav_industries: Отрасли
  nav_terms: Условия
  nav_entities: Юрлица
  nav_contact: Контакты
  menu: Меню
  cta: Пришлите позиции без предложений
  cta_subject: "Позиции без предложений для котировки"
  cta_body: |
    Учреждение или организация:
    Номер закупки или заказа (если есть):
    Место поставки:
    Требуемая дата:

    Позиции (артикул, описание, количество) или приложите спецификацию:

  cta_note: Откроется письмо с коротким шаблоном. Подойдет любая спецификация или таблица.

  terms_kicker: Условия
  terms_title: Мелкий шрифт простыми словами.
  pay_title: Как вы нам платите
  pay_items:
    - "Каждая позиция котируется по твердой фиксированной цене с доставкой. Фрахт, упаковка и сборы уже включены."
    - "Счет выставляется при поставке. Оплата производится в течение 30 дней после приемки товара или работы. Отклоненные позиции не оплачиваются."
    - "Принимаем оплату через ACH/EFT и банковским переводом. Чеки направляются на почтовый адрес соответствующего юрлица, указанный ниже."
    - "Юрлица в США выставляют счета в долларах США. Vraid Systems Limited (Альберта) выставляет счета в канадских или американских долларах, а для ООН и международных заказчиков также в других основных валютах. В канадских счетах указывается GST, если он применяется."
    - "Каждое юрлицо в США застраховано по общей гражданской ответственности: 1 000 000 долларов США на случай или претензию и 2 000 000 долларов США в совокупности. Форма W-9, сертификаты страхования и ваши анкеты поставщика предоставляются по запросу."
  supply_title: Как мы платим поставщикам
  supply_items:
    - "Мы направляем письменный заказ с артикулом, количеством, адресом доставки и сроком. Заказ и есть вся договоренность."
    - "Оплачиваем при заказе картой или через ACH и банковский перевод на согласованных условиях. Наша оплата вам никогда не зависит от оплаты нашим заказчиком."
    - "Большинство заказов отгружается напрямую заказчику. Возможна анонимная отгрузка, и мы никогда не раскрываем ваши цены конечному покупателю."
    - "Если у вас есть редкие, снятые с производства или складские излишки, пришлите свой каталог на адрес ниже."

  entities_kicker: Юридические лица
  entities_title: С кем вы заключаете договор.
  entities_intro: "Vraid Systems это группа из четырех компаний с общим владельцем. Каждая участвует в закупках на своем рынке и подписывает собственные договоры."
