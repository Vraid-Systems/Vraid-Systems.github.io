fr:
  locale: fr_FR
  nav_solutions: Solutions
  nav_industries: Domaines
  nav_terms: Conditions
  nav_entities: Entités
  nav_contact: Contact
  menu: Menu
  cta: Envoyez-nous vos lignes sans offre
  cta_subject: "Lignes sans offre à chiffrer"
  cta_body: |
    Organisme ou organisation :
    Numéro d'appel d'offres ou de bon de commande (le cas échéant) :
    Lieu de livraison :
    Date requise :

    Lignes (référence, désignation, quantité), ou joignez votre liste :

  cta_note: Ouvre un courriel avec un court modèle. Une liste ou un tableur suffit.

  terms_kicker: Conditions
  terms_title: Les petits caractères, en clair.
  pay_title: Comment vous nous payez
  pay_items:
    - "Chaque ligne est chiffrée à prix forfaitaire ferme, livraison comprise. Fret, emballage et frais sont inclus dans le montant."
    - "Nous facturons à la livraison. Le paiement est dû 30 jours après votre acceptation des biens ou des travaux. Les articles refusés ne sont pas facturés."
    - "La restauration des terres et des bassins versants est facturée selon le contrat, en général par situations mensuelles pour les travaux exécutés, la retenue de garantie éventuelle étant libérée à la réception définitive."
    - "Nous acceptons les paiements ACH/EFT et les virements bancaires. Les chèques sont à adresser à l'adresse postale de l'entité contractante indiquée ci-dessous."
    - "Les entités américaines facturent en USD. Vraid Systems Limited (Alberta) facture en CAD ou en USD, et dans d'autres grandes devises pour les Nations Unies et les acheteurs internationaux. Les factures canadiennes incluent la TPS lorsqu'elle s'applique."
    - "Chaque entité américaine est couverte par une assurance responsabilité civile générale de 1 000 000 USD par sinistre ou réclamation et de 2 000 000 USD au total. Formulaires W-9, attestations d'assurance et vos formulaires fournisseur sont disponibles sur demande."
  supply_title: Comment nous payons nos fournisseurs et sous-traitants
  supply_items:
    - "Pour les biens, nous envoyons un bon de commande écrit indiquant la référence, la quantité, l'adresse de livraison et la date requise. Le bon de commande constitue l'intégralité de l'accord."
    - "Nous payons les fournisseurs de biens à la commande par carte, ou par ACH ou virement selon les conditions convenues. Notre paiement ne dépend jamais du paiement de notre client."
    - "La plupart des commandes sont expédiées directement à notre client. L'expédition directe anonyme est possible, et nous ne communiquons jamais vos prix à l'acheteur final."
    - "Les sous-traitants de terrain en restauration des terres et des bassins versants travaillent sous un contrat de sous-traitance écrit, et non un bon de commande. Il fixe l'étendue des travaux, les assurances et les délais de paiement."
    - "Si vous avez en stock des articles introuvables, en fin de série ou en surplus, envoyez votre catalogue à l'adresse ci-dessous."

  experts_title: Comment nous payons les experts et consultants indépendants
  experts_items:
    - "Nous ne vous proposons dans une offre qu'avec votre accord écrit, pour les jours que vous travaillerez réellement, avec un CV que vous avez approuvé. Nous ne demandons pas d'exclusivité sauf si l'appel d'offres l'exige."
    - "Votre tarif journalier est convenu avant le dépôt de l'offre. Les jours travaillés sont payés mensuellement à terme échu sur la base de votre feuille de temps, par virement bancaire dans les 15 jours suivant votre facture, en USD par défaut."
    - "Notre paiement ne dépend jamais du paiement de notre client."

  entities_kicker: Entités contractantes
  entities_title: Avec qui vous contractez.
  entities_intro: "Vraid Systems est un groupe de quatre sociétés sous contrôle commun. Chacune soumissionne sur son propre marché et signe ses propres contrats."
