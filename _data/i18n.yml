  cta_subject: "Trabajo que quedó sin oferta"
  cta_body: |
    Organismo u organización:
    Número de licitación u orden de compra (si existe):
    Qué quedó sin oferta (partidas o una necesidad de datos o software):
    Lugar de entrega:
    Fecha requerida:

    Detalles, o adjunte su planilla o alcance:

  cta_note: "Una planilla o un alcance basta. Abre un correo con una plantilla breve."

  terms_kicker: Condiciones
  terms_title: La letra chica, en lenguaje claro.
  pay_title: Cómo nos paga
  pay_items:
    - "Cada partida se cotiza a precio fijo en firme, con entrega incluida. Flete, embalaje y cargos ya están en el precio."
    - "Facturamos al entregar. El pago vence 30 días después de que usted acepta los bienes o el trabajo. Lo que se rechaza no se factura."
    - "La recuperación de suelos y cuencas se factura según el contrato, normalmente con pagos mensuales por avance de obra ejecutada, y la retención, si la hay, se libera con la aceptación final."
    - "Aceptamos transferencia ACH/EFT y transferencia bancaria internacional. Los cheques se envían a la dirección postal de la entidad contratante indicada abajo."
    - "Las entidades de EE. UU. facturan en USD. Vraid Systems Limited (Alberta) factura en CAD o USD, y en otras monedas principales para la ONU y compradores internacionales. Las facturas canadienses incluyen GST cuando corresponde."
    - "Cada entidad de EE. UU. tiene un seguro de responsabilidad civil general de USD 1.000.000 por siniestro o reclamo y USD 2.000.000 en total. Formularios W-9, certificados de seguro y sus formularios de proveedor, a pedido."
  terms_partners_title: "Proveedores, cuadrillas y expertos"
  terms_partners_body: "Publicamos cómo pagamos a quienes hacen el trabajo: órdenes de compra para proveedores, subcontratos escritos para cuadrillas y tarifas diarias para expertos independientes."
  terms_partners_link: "Ver condiciones para socios"

  partners_kicker: "Socios"
  partners_title: "Trabaje con nosotros."
  partners_intro: "Vraid firma el contrato y asume el riesgo. El trabajo lo hacen proveedores especializados, cuadrillas locales y expertos independientes. Estas son nuestras condiciones para cada uno, por escrito, antes de que acepte."
  supply_title: "Proveedores"
  supply_items:
    - "Enviamos una orden de compra escrita con número de parte, cantidad, dirección de entrega y fecha requerida. La orden de compra es el acuerdo completo."
    - "Pagamos al ordenar con tarjeta, o por ACH o transferencia en los plazos acordados. Nuestro pago nunca depende de que nuestro cliente nos pague."
    - "La mayoría de los pedidos se envían directo a nuestro cliente. Aceptamos envío ciego y nunca compartimos sus precios con el comprador final."
    - "Si tiene en stock artículos difíciles de conseguir, descontinuados o excedentes, envíenos su catálogo."
  supply_cta: "Envíe su catálogo"
  supply_subject: "Catálogo de proveedor"
  crews_title: "Cuadrillas de campo"
  crews_items:
    - "Encontramos las obras públicas, preparamos la oferta, firmamos el contrato principal y nos encargamos de la documentación, los informes y las solicitudes de pago. Ustedes hacen el trabajo de campo."
    - "Cada obra se hace con un subcontrato escrito, no con una orden de compra. Fija el alcance, los seguros y los plazos de pago antes de empezar."
    - "Hoy trabajamos en Colorado y Wyoming, en demolición, desbroce de terrenos y retiro de escombros."
  crews_cta: "Presente su cuadrilla"
  crews_subject: "Presentación de cuadrilla"
  experts_title: "Expertos y consultores independientes"
  experts_items:
    - "Solo lo incluimos en una oferta con su consentimiento por escrito, por los días que realmente trabajará y con un CV que usted haya aprobado. No pedimos exclusividad salvo que la licitación lo exija."
    - "Su tarifa diaria se acuerda antes de presentar la oferta. Los días trabajados se pagan mensualmente, a mes vencido, contra su hoja de horas, por transferencia bancaria dentro de los 15 días de su factura, en USD por defecto."
    - "Nuestro pago nunca depende de que nuestro cliente nos pague."
  experts_cta: "Envíe su CV"
  experts_subject: "Presentación de experto independiente"

  entities_kicker: Entidades contratantes
  entities_title: Con quién contrata.
  entities_intro: "Vraid Systems es un grupo de cuatro empresas bajo propiedad común. Cada una licita en su propio mercado y firma sus propios contratos."
