  cta: Send Us Your No-Bid Lines
  cta_subject: "No-bid lines for quote"
  cta_body: |
    Agency or organization:
    Solicitation or PO number (if any):
    Delivery location:
    Need-by date:

    Lines (part number, description, quantity), or attach your line sheet:

  cta_note: Opens an email with a short template. A line sheet or spreadsheet is fine.

  terms_kicker: Terms
  terms_title: The fine print, in plain language.
  pay_title: How you pay us
  pay_items:
    - "Every line is quoted at a firm-fixed price, delivered. Freight, packaging, and fees are inside the number."
    - "We invoice on delivery. Payment is due 30 days after you accept the goods or the work. Rejected items are not billed."
    - "We accept ACH/EFT and wire transfer. Cheques go to the mailing address of the contracting entity below."
    - "US entities invoice in USD. Vraid Systems Limited (Alberta) invoices in CAD or USD, and in other major currencies for UN and international buyers. Canadian invoices include GST where it applies."
    - "Each US entity carries commercial general liability insurance of $1,000,000 per occurrence or claim and $2,000,000 aggregate. W-9s, certificates of insurance, and your vendor forms are available on request."
  supply_title: How we pay suppliers
  supply_items:
    - "We send a written purchase order with the part number, quantity, ship-to address, and required date. The PO is the whole agreement."
    - "We pay at order by card, or by ACH or wire on agreed terms. Paying you never depends on our customer paying us."
    - "Most orders ship direct to our customer. Blind drop-ship is fine, and we never share your pricing with the end buyer."
    - "If you stock hard-to-find, discontinued, or surplus items, send your line card to the address below."

  entities_kicker: Contracting entities
  entities_title: Who you contract with.
  entities_intro: "Vraid Systems is a group of four companies under common ownership. Each one bids in its own market and signs its own contracts."
