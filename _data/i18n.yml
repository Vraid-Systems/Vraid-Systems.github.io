fr:
  locale: fr_FR
  nav_solutions: Solutions
  nav_industries: Domaines
  nav_terms: Conditions
  nav_entities: Entités
  nav_partners: "Travailler avec nous"
  nav_contact: Contact
  menu: Menu
  cta: "Envoyez-nous ce qui est resté sans offre"
  cta_subject: "Travail resté sans offre"
  cta_body: |
    Organisme ou organisation :
    Numéro d'appel d'offres ou de bon de commande (le cas échéant) :
    Ce qui est resté sans offre (lignes d'articles ou besoin en données ou logiciels) :
    Lieu de livraison :
    Date requise :

    Détails, ou joignez votre liste ou votre cahier des charges :

  cta_note: "Une liste ou un cahier des charges suffit. Ouvre un courriel avec un court modèle."

  terms_kicker: Conditions
  terms_title: Les petits caractères, en clair.
  pay_title: Comment vous nous payez
  pay_items:
    - "Chaque ligne est chiffrée à prix forfaitaire ferme, livraison comprise. Fret, emballage et frais sont inclus dans le montant."
    - "Nous facturons à la livraison. Le paiement est dû 30 jours après votre acceptation des biens ou des travaux. Les articles refusés ne sont pas facturés."
    - "La restauration des terres et des bassins versants est facturée selon le contrat, en général par situations mensuelles pour les travaux exécutés, la retenue de garantie éventuelle étant libérée à la réception définitive."
    - "Nous acceptons les paiements ACH/EFT et les virements bancaires. Les chèques sont à adresser à l'adresse postale de l'entité contractante indiquée ci-dessous."
    - "Les entités américaines facturent en USD. Vraid Systems Limited (Alberta) facture en CAD ou en USD, et dans d'autres grandes devises pour les Nations Unies et les acheteurs internationaux. Les factures canadiennes incluent la TPS lorsqu'elle s'applique."
    - "Chaque entité américaine est couverte par une assurance responsabilité civile générale de 1 000 000 USD par sinistre ou réclamation et de 2 000 000 USD au total. Formulaires W-9, attestations d'assurance et vos formulaires fournisseur sont disponibles sur demande."
  terms_partners_title: "Fournisseurs, équipes et experts"
  terms_partners_body: "Nous publions la façon dont nous payons ceux qui font le travail : bons de commande pour les fournisseurs, contrats de sous-traitance écrits pour les équipes de terrain et tarifs journaliers pour les experts indépendants."
  terms_partners_link: "Lire nos conditions partenaires"

  partners_kicker: "Partenaires"
  partners_title: "Travaillez avec nous."
  partners_intro: "Vraid porte le contrat et assume le risque. Le travail est réalisé par des fournisseurs spécialisés, des équipes de terrain locales et des experts indépendants. Voici nos conditions pour chacun d'entre vous, par écrit, avant que vous ne disiez oui."
  supply_title: "Fournisseurs"
  supply_items:
    - "Nous envoyons un bon de commande écrit indiquant la référence, la quantité, l'adresse de livraison et la date requise. Le bon de commande constitue l'intégralité de l'accord."
    - "Nous payons à la commande par carte, ou par ACH ou virement selon les conditions convenues. Notre paiement ne dépend jamais du paiement de notre client."
    - "La plupart des commandes sont expédiées directement à notre client. L'expédition directe anonyme est possible, et nous ne communiquons jamais vos prix à l'acheteur final."
    - "Si vous avez en stock des articles introuvables, en fin de série ou en surplus, envoyez-nous votre catalogue."
  supply_cta: "Envoyez votre catalogue"
  supply_subject: "Catalogue fournisseur"
  crews_title: "Équipes de terrain"
  crews_items:
    - "Nous trouvons les chantiers publics, rédigeons l'offre, portons le contrat principal et gérons les soumissions, les rapports et les demandes de paiement. Vous réalisez les travaux sur le terrain."
    - "Chaque chantier se fait sous un contrat de sous-traitance écrit, et non un bon de commande. Il fixe l'étendue des travaux, les assurances et les délais de paiement avant le démarrage."
    - "Nous travaillons aujourd'hui au Colorado et au Wyoming, en démolition, défrichement de terrains et enlèvement de débris."
  crews_cta: "Présentez votre équipe"
  crews_subject: "Présentation d'équipe de terrain"
  experts_title: "Experts et consultants indépendants"
  experts_items:
    - "Nous ne vous proposons dans une offre qu'avec votre accord écrit, pour les jours que vous travaillerez réellement, avec un CV que vous avez approuvé. Nous ne demandons pas d'exclusivité sauf si l'appel d'offres l'exige."
    - "Votre tarif journalier est convenu avant le dépôt de l'offre. Les jours travaillés sont payés mensuellement à terme échu sur la base de votre feuille de temps, par virement bancaire dans les 15 jours suivant votre facture, en USD par défaut."
    - "Notre paiement ne dépend jamais du paiement de notre client."
  experts_cta: "Envoyez votre CV"
  experts_subject: "Présentation d'expert indépendant"

  entities_kicker: Entités contractantes
  entities_title: Avec qui vous contractez.
  entities_intro: "Vraid Systems est un groupe de quatre sociétés sous contrôle commun. Chacune soumissionne sur son propre marché et signe ses propres contrats."
