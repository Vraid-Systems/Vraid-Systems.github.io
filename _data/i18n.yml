es:
  locale: es_ES
  nav_solutions: Soluciones
  nav_industries: Industrias
  nav_terms: Condiciones
  nav_entities: Entidades
  nav_contact: Contacto
  menu: Menú
  cta: Envíenos sus partidas sin oferta
  cta_subject: "Partidas sin oferta para cotizar"
  cta_body: |
    Organismo u organización:
    Número de licitación u orden de compra (si existe):
    Lugar de entrega:
    Fecha requerida:

    Partidas (número de parte, descripción, cantidad), o adjunte su planilla:

  cta_note: Abre un correo con una plantilla breve. Una planilla o una hoja de cálculo sirven.

  terms_kicker: Condiciones
  terms_title: La letra chica, en lenguaje claro.
  pay_title: Cómo nos paga
  pay_items:
    - "Cada partida se cotiza a precio fijo en firme, con entrega incluida. Flete, embalaje y cargos ya están en el precio."
    - "Facturamos al entregar. El pago vence 30 días después de que usted acepta los bienes o el trabajo. Lo que se rechaza no se factura."
    - "Aceptamos transferencia ACH/EFT y transferencia bancaria internacional. Los cheques se envían a la dirección postal de la entidad contratante indicada abajo."
    - "Las entidades de EE. UU. facturan en USD. Vraid Systems Limited (Alberta) factura en CAD o USD, y en otras monedas principales para la ONU y compradores internacionales. Las facturas canadienses incluyen GST cuando corresponde."
    - "Cada entidad de EE. UU. tiene un seguro de responsabilidad civil general de USD 1.000.000 por siniestro o reclamo y USD 2.000.000 en total. Formularios W-9, certificados de seguro y sus formularios de proveedor, a pedido."
  supply_title: Cómo pagamos a nuestros proveedores
  supply_items:
    - "Enviamos una orden de compra escrita con número de parte, cantidad, dirección de entrega y fecha requerida. La orden de compra es el acuerdo completo."
    - "Pagamos al ordenar con tarjeta, o por ACH o transferencia en los plazos acordados. Nuestro pago nunca depende de que nuestro cliente nos pague."
    - "La mayoría de los pedidos se envían directo a nuestro cliente. Aceptamos envío ciego y nunca compartimos sus precios con el comprador final."
    - "Si tiene en stock artículos difíciles de conseguir, descontinuados o excedentes, envíe su catálogo a la dirección de abajo."

  entities_kicker: Entidades contratantes
  entities_title: Con quién contrata.
  entities_intro: "Vraid Systems es un grupo de cuatro empresas bajo propiedad común. Cada una licita en su propio mercado y firma sus propios contratos."
  established: Fundada
