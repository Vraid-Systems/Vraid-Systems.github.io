ru:
  locale: ru_RU
  nav_solutions: Решения
  nav_industries: Направления
  nav_terms: Условия
  nav_entities: Юрлица
  nav_partners: "Сотрудничество"
  nav_contact: Контакты
  menu: Меню
  cta: "Пришлите то, на что нет предложений"
  cta_subject: "Работа без предложений"
  cta_body: |
    Учреждение или организация:
    Номер закупки или заказа (если есть):
    На что нет предложений (позиции или задача по данным или ПО):
    Место поставки:
    Требуемая дата:

    Подробности или приложите спецификацию или техническое задание:

  cta_note: "Достаточно спецификации или описания задачи. Откроется письмо с коротким шаблоном."

  terms_kicker: Условия
  terms_title: Мелкий шрифт простыми словами.
  pay_title: Как вы нам платите
  pay_items:
    - "Каждая позиция котируется по твердой фиксированной цене с доставкой. Фрахт, упаковка и сборы уже включены."
    - "Счет выставляется при поставке. Оплата производится в течение 30 дней после приемки товара или работы. Отклоненные позиции не оплачиваются."
    - "Работы по восстановлению земель и водосборов оплачиваются по условиям контракта, как правило ежемесячными платежами за выполненный объем, а удержание, если оно есть, возвращается после окончательной приемки."
    - "Принимаем оплату через ACH/EFT и банковским переводом. Чеки направляются на почтовый адрес соответствующего юрлица, указанный ниже."
    - "Юрлица в США выставляют счета в долларах США. Vraid Systems Limited (Альберта) выставляет счета в канадских или американских долларах, а для ООН и международных заказчиков также в других основных валютах. В канадских счетах указывается GST, если он применяется."
    - "Каждое юрлицо в США застраховано по общей гражданской ответственности: 1 000 000 долларов США на случай или претензию и 2 000 000 долларов США в совокупности. Форма W-9, сертификаты страхования и ваши анкеты поставщика предоставляются по запросу."
  terms_partners_title: "Поставщики, бригады и эксперты"
  terms_partners_body: "Мы публикуем, как платим исполнителям: заказы для поставщиков, письменные договоры субподряда для бригад и дневные ставки для независимых экспертов."
  terms_partners_link: "Условия для партнеров"

  partners_kicker: "Партнерам"
  partners_title: "Работайте с нами."
  partners_intro: "Vraid заключает договор и несет риск. Работу выполняют специализированные поставщики, местные бригады и независимые эксперты. Вот наши условия для каждого из вас, письменно, до того как вы согласитесь."
  supply_title: "Поставщики"
  supply_items:
    - "Мы направляем письменный заказ с артикулом, количеством, адресом доставки и сроком. Заказ и есть вся договоренность."
    - "Оплачиваем при заказе картой или через ACH и банковский перевод на согласованных условиях. Наша оплата вам никогда не зависит от оплаты нашим заказчиком."
    - "Большинство заказов отгружается напрямую заказчику. Возможна анонимная отгрузка, и мы никогда не раскрываем ваши цены конечному покупателю."
    - "Если у вас есть редкие, снятые с производства или складские излишки, пришлите нам свой каталог."
  supply_cta: "Отправить каталог"
  supply_subject: "Каталог поставщика"
  crews_title: "Полевые бригады"
  crews_items:
    - "Мы находим государственные заказы, готовим заявку, заключаем генеральный договор и ведем документацию, отчетность и заявки на оплату. Вы выполняете полевые работы."
    - "Каждый объект выполняется по письменному договору субподряда, а не по заказу. В нем до начала работ определяются объем, страхование и сроки оплаты."
    - "Сейчас мы работаем в Колорадо и Вайоминге: снос, расчистка участков и вывоз завалов."
  crews_cta: "Представить бригаду"
  crews_subject: "Знакомство с бригадой"
  experts_title: "Независимые эксперты и консультанты"
  experts_items:
    - "Мы включаем вас в заявку только с вашего письменного согласия, на то количество дней, которое вы действительно отработаете, и с резюме, которое вы одобрили. Мы не требуем эксклюзивности, если этого не требует тендер."
