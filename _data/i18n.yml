en:
  locale: en_US
  nav_solutions: Solutions
  nav_industries: Work Streams
  nav_terms: Terms
  nav_entities: Entities
  nav_partners: "Work With Us"
  nav_contact: Contact
  menu: Menu
  cta: "Send Us What Came Back No-Bid"
  cta_subject: "Work that came back no-bid"
  cta_body: |
    Agency or organization:
    Solicitation or PO number (if any):
    What came back no-bid (line items, a data or software need, or a site):
    Delivery location or site address:
    Need-by date:

    Details, or attach your line sheet, scope, or drawings:

  cta_note: "A line sheet, a scope, or a site address is enough. Opens an email with a short template."

  terms_kicker: Terms
  terms_title: The fine print, in plain language.
  pay_title: How you pay us
  pay_items:
    - "Every line is quoted at a firm-fixed price, delivered. Freight, packaging, and fees are inside the number."
    - "We invoice on delivery. Payment is due 30 days after you accept the goods or the work. Rejected items are not billed."
    - "Land and watershed recovery is billed as the contract provides, usually monthly progress payments for work in place, with any retainage released at final acceptance."
    - "We accept ACH/EFT and wire transfer. Cheques go to the mailing address of the contracting entity below."
    - "US entities invoice in USD. Vraid Systems Limited (Alberta) invoices in CAD or USD, and in other major currencies for UN and international buyers. Canadian invoices include GST where it applies."
    - "Each US entity carries commercial general liability insurance of $1,000,000 per occurrence or claim and $2,000,000 aggregate. W-9s, certificates of insurance, and your vendor forms are available on request."
  terms_partners_title: "Suppliers, crews, and experts"
  terms_partners_body: "We publish how we pay the people who do the work: purchase orders for suppliers, written subcontracts for field crews, and day rates for independent experts."
  terms_partners_link: "Read our partner terms"

  partners_kicker: "Partners"
  partners_title: "Work with us."
  partners_intro: "Vraid holds the contract and carries the risk. The work is done by specialty suppliers, local field crews, and independent experts. These are our terms for each of you, in writing, before you say yes."
  supply_title: "Suppliers"
  supply_items:
    - "We send a written purchase order with the part number, quantity, ship-to address, and required date. The PO is the whole agreement."
    - "We pay at order by card, or by ACH or wire on agreed terms. Paying you never depends on our customer paying us."
    - "Most orders ship direct to our customer. Blind drop-ship is fine, and we never share your pricing with the end buyer."
    - "If you stock hard-to-find, discontinued, or surplus items, send us your line card."
  supply_cta: "Send your line card"
  supply_subject: "Supplier line card"
  crews_title: "Field crews"
  crews_items:
    - "We find the public jobs, write the bid, hold the prime contract, and handle submittals, reporting, and pay applications. You do the field work."
    - "Every job runs under a written subcontract, not a purchase order. It sets the scope, insurance, and payment timing before you start."
    - "We work in Colorado and Wyoming today, on demolition, site clearing, and debris removal."
  crews_cta: "Introduce your crew"
  crews_subject: "Field crew introduction"
  experts_title: "Independent experts and consultants"
  experts_items:
    - "We name you on a bid only with your written consent, for the days you will actually work, using a CV you have approved. We don't ask for exclusivity unless the tender requires it."
    - "Your day rate is agreed before we submit. Days worked are paid monthly in arrears against your timesheet, by bank transfer within 15 days of your invoice, in USD by default."
    - "Paying you never depends on our customer paying us."
  experts_cta: "Send your CV"
  experts_subject: "Independent expert introduction"

  entities_kicker: Contracting entities
  entities_title: Who you contract with.
  entities_intro: "Vraid Systems is a group of four companies under common ownership. Each one bids in its own market and signs its own contracts."
