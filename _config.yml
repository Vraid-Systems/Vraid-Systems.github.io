description:
  en: Firm-Fixed-Price. Paid on Acceptance.
  es: Precio Fijo en Firme. Pago Contra Aceptación.
  fr: Prix forfaitaire ferme. Paiement à l'acceptation.
  ru: Твердая фиксированная цена. Оплата после приемки.
slug:
  en: No surcharges. No "best efforts". Pay on acceptance.
  es: Sin recargos. Nada de "haremos lo posible". Pago contra aceptación.
  fr: Aucune majoration. Pas de « nous ferons de notre mieux ». Paiement à l'acceptation.
  ru: Никаких наценок. Никаких «мы сделаем все возможное». Оплата после приемки.
title: Vraid Systems
url: https://vraidsys.com
# Site languages, in switcher order. The first one is x-default.
