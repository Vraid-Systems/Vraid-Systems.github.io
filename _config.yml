about:
  en: "Vraid Systems works for public agencies, universities, and international organizations. We take the work that comes back no-bid: the discontinued line item, the data system too small for the big integrators, the site too small for the big contractors. You get one contract and one fixed price, a vetted network does the work, and you pay only for what you accept."
  es: "Vraid Systems trabaja para organismos públicos, universidades y organizaciones internacionales. Tomamos el trabajo que queda sin oferta: la partida descontinuada, el sistema de datos demasiado pequeño para los grandes integradores. Usted firma un solo contrato a precio fijo, una red verificada hace el trabajo y usted paga solo lo que acepta."
  fr: "Vraid Systems travaille pour des organismes publics, des universités et des organisations internationales. Nous prenons le travail qui reste sans offre : l'article en fin de série, le système de données trop petit pour les grands intégrateurs. Vous signez un seul contrat à prix ferme, un réseau vérifié réalise le travail, et vous ne payez que ce que vous acceptez."
  ru: "Vraid Systems работает с государственными учреждениями, университетами и международными организациями. Мы берем работу, на которую никто не подал предложений: снятую с производства позицию, систему данных, слишком малую для крупных интеграторов. Вы заключаете один договор по фиксированной цене, работу выполняет проверенная сеть, а вы платите только за то, что приняли."
contact: sales@vraidsys.com
# Focal Point for the conduct and inclusion policies (conduct.html). Keep this a person, not the automated sales inbox.
conduct_contact: trust@vraidsys.com
description:
  en: Firm-Fixed-Price. Paid on Acceptance.
  es: Precio Fijo en Firme. Pago Contra Aceptación.
  fr: Prix forfaitaire ferme. Paiement à l'acceptation.
  ru: Твердая фиксированная цена. Оплата после приемки.
slug:
  en: No surcharges. No "best efforts". Pay on acceptance.
  es: Sin recargos. Nada de "haremos lo posible". Pago contra aceptación.
  fr: Aucune majoration. Pas de « nous ferons de notre mieux ». Paiement à l'acceptation.
  ru: Никаких наценок. Никаких «мы сделаем все возможное». Оплата после приемки.
title: Vraid Systems
url: https://vraidsys.com
# Site languages, in switcher order. The first one is x-default.
