about:
  en: Vraid Systems works for public agencies, universities, and international organizations. We source the specialized, discontinued, and low-volume items other vendors decline to quote, and we configure the software platforms you already license. Pricing is fixed, and you pay only after you accept delivery.
  es: Vraid Systems trabaja para organismos públicos, universidades y organizaciones internacionales. Conseguimos los artículos especializados, descontinuados y de bajo volumen que otros proveedores no cotizan, y configuramos las plataformas de software que usted ya tiene licenciadas. El precio es fijo y usted paga solo después de aceptar la entrega.
  ru: Vraid Systems работает с государственными учреждениями, университетами и международными организациями. Мы находим специализированные, снятые с производства и малотиражные позиции, которые другие поставщики отказываются котировать, и настраиваем программные платформы, на которые у вас уже есть лицензии. Цена фиксирована, а оплата производится только после приемки поставки.
contact: sales@vraidsys.com
description:
  en: Firm-Fixed-Price. Paid on Acceptance.
  es: Precio Fijo en Firme. Pago Contra Aceptación.
  ru: Твердая фиксированная цена. Оплата после приемки.
slug:
